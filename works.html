<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kafel's works gallery'</title>

    <style>
        @font-face {
            font-family: "fixed-mont";
            src: url("montserrat-sb.ttf") format('truetype');
            font-style: normal;
            font-weight: 600;
        }
        @font-face {
            font-family: "fixed-mont-m";
            src: url("montserrat-m.ttf") format('truetype');
            font-style: normal;
            font-weight: 600;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }
        body {
            font-family: fixed-mont;
            margin: 0;
            padding: 0;
            background-color: #212121;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gray_rect {
            width: 800px;
            max-width: 800px;

            background-color: rgba(0,0,0,0.5);
            border-radius: 3rem;
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            box-sizing: border-box;
            gap: 2rem;
            text-align: center;
            color: white;
            font-family: fixed-mont-m;
            font-size: clamp(11pt, 2.2vw, 12pt);
        }
        .bar_rect {
            width: 100%;
            height: 10%;
            background: #ffffff;
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(171, 171, 171, 1) 100%);
            border-radius: 1.5rem;
            z-index: 2;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 2rem;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.25);
        }
        .ava {
            position: relative;
            place-self: self-end;
            width: 32%;
            height: 32%;
            background: #ffffff;
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(171, 171, 171, 1) 100%);
            border-radius: 1.5rem;
            z-index: 2;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 1rem;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.25);
            object-fit: cover;
            overflow: hidden;
        }
        .avabg {
            background-image: url("uhh.png");
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            align-items: end;
            justify-content: center;
            object-fit: cover;
            border-radius: 1rem;
            overflow: hidden;
        }
        .ass {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 85%;
            gap: 2rem;
            align-items: stretch;
        }
        .descbox {
            background: #ffffff;
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(171, 171, 171, 1) 100%);
            position: relative;
            place-self: self-start;
            align-self: start;
            z-index: 4;
            border-radius: 1.5rem;
            padding: 1rem;
            text-align: center;
            width: 100%; /* FIXED: Forces container to scale nicely */
            box-sizing: border-box;
            color: black;
            font-family: fixed-mont;
        }
        .desc {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-items: stretch;
            border-radius: 1rem;
            overflow: hidden;
            margin-top: 1rem;
            background-color: black;
        }
        .a3 {
            color: white;
            width: 100%;
            padding: 0.5rem;
            transition: transform 0.2s ease, text-shadow 0.2s ease;
            font-size: clamp(13pt, 2.2vw, 15pt);
        }
        .a3:hover {
            transform: scaleX(1.1);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.25); 
            z-index: 5;
        }
        .desc2 {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            margin-top: 1rem;
            border-radius: 1rem;
            width: 100%;
            box-sizing: border-box; 
            overflow:hidden;
            z-index: 4;
        }
        .desc2 a {
            width: calc(100% / 8); 
            height: auto;
            display: block;
            text-shadow: none !important;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1;
            object-fit: cover;
            z-index: 5;
            transition: transform 0.2s ease;
        }
        .desc2 a:hover img {
            transform: scaleX(1.25);
            z-index: 5;
        }
        .links {
            grid-area: 4 / 1 / 5 / 3;
        }
        header {
            color: black;
            font-family: fixed-mont;
            font-size: 16pt;
            font-size: clamp(16pt, 2.2vw, 18pt);
            text-shadow: 0px 0px 8px rgba(0,0,0,0.15);
        }

        a {
            color: black;
            font-family: fixed-mont-m;
            font-size: clamp(14pt, 2vw, 16pt);
            text-shadow: 0px 0px 8px rgba(0,0,0,0.15);
            text-decoration: none;
        }
        a:hover {
            text-shadow: 0px 0px 8px rgba(0,0,0,0.35);
        }
        .a2 {
            color: white;
            font-size: clamp(8pt, 2.2vw, 12pt);
        }
        .a2:hover {
            text-shadow: 0px 0px 8px rgba(255,255,255,0.75);
        }
        .wrapper {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            transform: rotate(12deg);
            overflow: hidden;
            z-index:-1;
        }
        .edn{
            display: none;
        }

        .checkerboard {
            width: 100%;
            height: 100%;
            background-image: linear-gradient(45deg, #5c5c5c 25%, transparent 25%), linear-gradient(-45deg, #5c5c5c 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #5c5c5c 75%), linear-gradient(-45deg, transparent 75%, #5c5c5c 75%);
            background-size: 120px 120px;
            background-position: 0 0, 0 60px, 60px -60px, -60px 0px;
            background-color: #3d3d3d;

            animation: scroll 6s linear infinite;
            position: relative;
        }
            .checkerboard::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at 15% 15%, rgba(255,255,255,0.22) 0%, rgba(0,0,0,0.45) 85%);
                pointer-events: none;
            }
        @keyframes scroll {
            0% {
                background-position: 0px 0px, 0px 60px, 60px -60px, -60px 0px;
            }

            100% {
                background-position: 120px 120px, 120px 180px, 180px 60px, 60px 120px;
            }
        }
        @media (max-width: 700px){
            html,body{
                overflow-x: hidden;
                overflow-y: auto;
            }
            .gray_rect{
                height: contain;
                width: 90%;
                position:absolute;
                top: 2.5%;
            }
            .ava{
                width: 0;
                height: 0;
            }
            .desc{
                flex-direction: column;
                gap: 0;
            }
            .a3 {
                padding: 0.25rem;
                padding-top: 0.5rem;
                padding-bottom: 0.5rem;
            }
            .edn {
                display: block;
                color: white;
                position: fixed;
                bottom: 50px;
                right: auto;
                left: auto;
                z-index: 1;
                text-align: center;
            }
        }
    </style>
</head>
